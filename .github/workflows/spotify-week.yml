name: Spotify weekly chart

# Every hour, count new Spotify plays into data/spotify-week.json for the homepage's
# "My most listened this week". Spotify only shares the last 50 plays, so it has to check
# often. Off-the-hour minutes are less congested on GitHub; a late or skipped run is fine
# as long as fewer than 50 songs were played in between.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:  # "Run workflow" button for testing

concurrency:
  group: spotify-week   # never two runs at once, so plays can't be counted twice

permissions:
  contents: write

jobs:
  tally:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Count new plays
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/spotify-week.mjs

      - name: Save the chart if it changed
        run: |
          if git diff --quiet -- data/spotify-week.json && git ls-files --error-unmatch data/spotify-week.json >/dev/null 2>&1; then
            echo "No new plays."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spotify-week.json
          git commit -m "Update weekly Spotify chart"
          git pull --rebase origin main
          git push origin HEAD:main
